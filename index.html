<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="玄曜 Web 版 1.4｜手機優先 AI 工作中樞">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <title>玄曜｜專屬 AI 核心</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><div class="eyebrow">XUANYAO CORE 1.4</div><h1>玄曜</h1><p>你的專屬 AI 工作中樞</p></div>
      <div class="status"><span></span> ONLINE</div>
    </header>

    <section class="core-card">
      <div class="core-orb">玄</div>
      <div class="core-info"><strong>玄曜核心</strong><span id="coreState">待命中｜本機核心</span></div>
      <button id="clearBtn" class="ghost-btn" type="button">清除對話</button>
    </section>

    <nav class="quick-actions" aria-label="快速功能">
      <button data-prompt="幫我整理今天最重要的事情">整理今天</button>
      <button data-prompt="幫我規劃下一步">下一步</button>
      <button data-prompt="幫我檢查玄曜專案目前還缺什麼">檢查專案</button>
      <button data-prompt="啟動玄曜最佳化模式">最佳化</button>
    </nav>

    <section id="chat" class="chat" aria-live="polite"></section>

    <section class="panel">
      <div class="panel-title">記憶與資料中心</div>
      <div class="memory-tools"><button id="saveMemoryBtn" type="button">將目前輸入存為記憶</button><button id="clearMemoryBtn" type="button">清除本機記憶</button><span id="memoryCount">記憶 0</span></div>
      <div class="data-tools">
        <input id="dataSearch" type="search" placeholder="搜尋已保存的資料…">
        <button id="exportBtn" type="button">匯出</button>
        <label class="file-btn">匯入<input id="importFile" type="file" accept="application/json"></label>
      </div>
      <div id="dataList" class="data-list"></div><div class="tool-list"><div class="tool-chip"><b>🧠 記憶</b><span>本機安全｜自動</span></div><div class="tool-chip"><b>📋 任務</b><span>本機安全｜自動</span></div><div class="tool-chip"><b>📦 資料匯出</b><span>本機安全｜自動</span></div><div class="tool-chip"><b>🌐 外部工具</b><span>需確認</span></div></div>
    </section>

    <section class="panel">
      <div class="panel-title">任務中心｜自動拆解</div>
      <div class="task-tools"><button id="planTaskBtn" type="button">用玄曜拆解目前任務</button></div>
      <form id="taskForm" class="task-form">
        <input id="taskInput" placeholder="新增任務，例如：完成玄曜 AI 後端" autocomplete="off">
        <button type="submit">新增</button>
      </form>
      <div id="taskList" class="task-list"></div>
    </section>

    <section class="panel">
      <div class="panel-title">核心能力｜工具中心</div>
      <div class="gateway-row"><input id="gatewayInput" type="url" placeholder="AI Gateway（可選）"><button id="saveGatewayBtn" type="button">儲存</button></div>
      <div class="grid">
        <div><b>對話</b><span>已啟用</span></div>
        <div><b>本機記憶</b><span>已啟用</span></div>
        <div><b>資料中心</b><span>已啟用</span></div>
        <div><b>任務中心</b><span>已啟用</span></div>
        <div><b>工具層</b><span>預留</span></div>
        <div><b>AI 後端</b><span id="backendState">Demo</span></div>
      </div>
    </section>

    <form id="composer" class="composer">
      <textarea id="message" rows="1" placeholder="告訴玄曜你要做什麼…" autocomplete="off"></textarea>
      <button type="submit" aria-label="送出">➤</button>
    </form>

    <footer>玄曜 Web 版 1.4 · 手機優先 · 可離線 · 資料留在你的裝置</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
